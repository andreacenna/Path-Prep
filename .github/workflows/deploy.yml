name: Build, test & deploy (with daily briefing)

# Free on public repositories: GitHub Actions minutes + GitHub Pages hosting.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,16 * * *' # twice a day (UTC): refresh the PATH Daily Briefing
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed news.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh daily briefing (scheduled / manual runs)
        if: github.event_name != 'push'
        run: npm run news
      - name: Commit briefing if changed
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain public/data)" ]; then
            git config user.name "path-briefing-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/news.json
            git commit -m "chore(news): refresh daily briefing [skip ci]"
            git push
          fi

      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
